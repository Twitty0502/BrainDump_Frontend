<main class="home">
    <h1>Gå med i en board</h1>
    <p>Skriv in board-ID:t och ditt visningsnamn nedan:</p>

    <form (ngSubmit)="joinBoard()">
        <label for="boardId">Board-ID: </label>
        <input id="boardId" type="text" name="boardId" [(ngModel)]="boardId" required placeholder="Ange boardens ID">

        <br>
        <label for="displayName">Ditt visningsnamn: </label>
        <input id="displayName" type="text" name="displayName" [(ngModel)]="displayName" maxlength="15" required
            placeholder="Ange ditt visningsnamn">

        <button type="submit">Anslut</button>
    </form>

    <p>{{ message }}</p>

    <section class="recent-boards">
        <h2>Senast besökt board:</h2>

        @for (board of recentBoards; track board.id) {
        <button type="button" class="recent-board" (click)="selectRecentBoard(board)">
            {{ board.name }}
        </button>
        } @empty {
        <div>Inga nyligen besökta boards.</div>
        }
    </section>

    <a routerLink="/">Tillbaka till startsidan</a>
</main>
